<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171923">
<title>HaruNet · 组网观察台</title>
<style>
  :root {
    --bg: #12131c; --panel: #1a1c27; --panel2: #232634; --line: #2b2f42;
    --text: #d7dae6; --dim: #868ba0; --accent: #7aa2f7; --accent2: #3d59a1;
    --green: #9ece6a; --yellow: #e0af68; --orange: #ff9e64; --red: #f7768e;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; }

  /* ── 顶栏 ─────────────────────────────────────────── */
  header { position: sticky; top: 0; z-index: 9; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 10px 12px 8px; flex: 0 0 auto; }
  .topRow { display: flex; align-items: center; gap: 10px; }
  .topRow h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .3px; }
  .topRow .sub { margin-left: auto; color: var(--dim); font-size: 12px; }
  #menuBtn { width: 32px; height: 32px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--accent); font-size: 16px; cursor: pointer; }
  .agents { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; padding-bottom: 2px;
    scrollbar-width: none; }
  .agents::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 10px; font-size: 12px; color: var(--text); }
  .chip .st { color: var(--dim); font-size: 11px; }
  .attBadge { color: var(--accent); font-size: 11px; background: rgba(122,162,247,.12);
    border-radius: 6px; padding: 0 6px; line-height: 17px; flex: 0 0 auto; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; display: inline-block; }
  .dot.idle { background: var(--green); } .dot.working { background: var(--yellow);
    animation: pulse 1.2s infinite; } .dot.maintenance { background: var(--orange); }
  .dot.offline { background: #52576b; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  /* ── 话语权条 ─────────────────────────────────────── */
  #floorBar { flex: 0 0 auto; padding: 6px 12px 0; }
  .floorLine { display: flex; align-items: center; gap: 8px; }
  #floorState { font-size: 12px; color: var(--text); }
  #floorState .fname { color: var(--yellow); font-weight: 650; }
  .floorChips { display: flex; gap: 6px; overflow-x: auto; padding-top: 6px;
    scrollbar-width: none; }
  .floorChips::-webkit-scrollbar { display: none; }
  .floorChip { flex: 0 0 auto; font-size: 12px; padding: 3px 10px;
    border-radius: 999px; border: 1px solid var(--line); color: var(--dim);
    background: var(--panel2); }
  .floorChip.arch { color: var(--orange);
    border-color: rgba(255,158,100,.5); }
  .floorChip.release { color: var(--red); border-color: rgba(247,118,142,.5);
    background: rgba(247,118,142,.08); }
  .floorChip:disabled { opacity: .45; }

  /* ── 过滤页签 ─────────────────────────────────────── */
  .tabs { display: flex; gap: 8px; padding: 8px 12px 0; flex: 0 0 auto; }
  .tab { flex: 1; text-align: center; padding: 6px 0; border-radius: 10px; font-size: 13px;
    background: transparent; color: var(--dim); border: 1px solid var(--line); }
  .tab.on { color: var(--accent); border-color: var(--accent2);
    background: rgba(122,162,247,.08); }

  /* ── 消息流 ───────────────────────────────────────── */
  main { flex: 1; overflow-y: auto; padding: 10px 12px 14px; }
  .msg { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 9px 12px 10px; margin-bottom: 8px; }
  .msg.mention { border-color: rgba(255,158,100,.55);
    box-shadow: inset 3px 0 0 var(--orange); }
  .msg.self { border-color: rgba(122,162,247,.5); box-shadow: inset 3px 0 0 var(--accent); }
  .meta { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  .who { font-weight: 650; color: var(--accent); }
  .badge { font-size: 11px; color: var(--yellow); background: rgba(224,175,104,.12);
    border-radius: 6px; padding: 0 6px; line-height: 17px; }
  .badge.at { color: var(--orange); background: rgba(255,158,100,.12); }
  .time { margin-left: auto; color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .text { white-space: pre-wrap; word-break: break-word; }
  .atts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .att { display: inline-flex; gap: 4px; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 8px; padding: 3px 9px; color: var(--accent); font-size: 12px;
    text-decoration: none; }
  .attMedia { display: block; max-width: 100%; max-height: 320px; border-radius: 10px;
    border: 1px solid var(--line); background: #000; }
  .empty { text-align: center; color: var(--dim); padding: 56px 0; font-size: 13px; }

  #newpill { position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom) + 118px);
    background: var(--accent); color: #10121a; font-weight: 650; font-size: 13px;
    padding: 7px 16px; border-radius: 999px; display: none; z-index: 40;
    box-shadow: 0 6px 18px rgba(122,162,247,.4); }

  /* ── 底部输入栏 ───────────────────────────────────── */
  #composer { flex: 0 0 auto; background: var(--panel); border-top: 1px solid var(--line);
    padding: 8px 12px calc(env(safe-area-inset-bottom) + 8px); }
  .mentionRow { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 7px;
    scrollbar-width: none; }
  .mentionRow::-webkit-scrollbar { display: none; }
  .mchip { flex: 0 0 auto; font-size: 12px; padding: 2px 10px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim); background: var(--panel2); }
  .mchip.on { color: var(--orange); border-color: rgba(255,158,100,.65);
    background: rgba(255,158,100,.12); }
  .inputRow { display: flex; align-items: flex-end; gap: 8px; }
  #input { flex: 1; resize: none; max-height: 96px; min-height: 38px;
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 12px; padding: 9px 12px; font: inherit; outline: none; }
  #input:focus { border-color: var(--accent2); }
  #sendBtn { flex: 0 0 auto; height: 38px; padding: 0 16px; border: 0; border-radius: 12px;
    background: var(--accent); color: #0e1017; font-weight: 700; font: inherit; }
  #sendBtn:disabled { opacity: .45; }
  #sendHint { font-size: 11px; color: var(--red); padding-top: 5px; display: none; }

  /* ── 抽屉 ─────────────────────────────────────────── */
  #mask { position: fixed; inset: 0; background: rgba(0,0,0,.5); opacity: 0;
    pointer-events: none; transition: opacity .18s; z-index: 50; }
  #mask.on { opacity: 1; pointer-events: auto; }
  #drawer { position: fixed; top: 0; bottom: 0; left: 0; width: 84%; max-width: 370px;
    background: var(--panel); border-right: 1px solid var(--line);
    transform: translateX(-102%); transition: transform .2s ease; z-index: 60;
    display: flex; flex-direction: column; padding: 14px; padding-top: calc(14px + env(safe-area-inset-top)); }
  #drawer.on { transform: translateX(0); }
  .drawerHead { display: flex; align-items: center; gap: 10px; padding-bottom: 10px;
    border-bottom: 1px solid var(--line); }
  .drawerHead h2 { font-size: 15px; margin: 0; font-weight: 650; }
  .drawerHead .cnt { color: var(--dim); font-size: 12px; margin-left: auto; }
  .agentList, .detail { flex: 1; overflow-y: auto; padding-top: 8px; }
  /* 详情页容器必须是限高 flex 列，内层 .detail 的 overflow-y 才会生效 */
  #agentDetail { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .agentItem { display: flex; align-items: center; gap: 10px; padding: 10px 6px;
    border-radius: 12px; }
  .agentItem:active { background: var(--panel2); }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--panel2);
    border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
    font-weight: 650; color: var(--accent); flex: 0 0 auto; }
  .agentItem .info { flex: 1; min-width: 0; }
  .agentItem .n { font-weight: 600; display: flex; gap: 6px; align-items: center; }
  .agentItem .s { color: var(--dim); font-size: 12px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .back { color: var(--accent); font-size: 13px; padding: 4px 0; }
  .detail .bigName { font-size: 18px; font-weight: 700; display: flex; gap: 8px;
    align-items: center; margin-bottom: 6px; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 8px 2px;
    border-bottom: 1px dashed var(--line); font-size: 13px; }
  .kv .k { color: var(--dim); }
  .kv .v { text-align: right; word-break: break-all; }
  .section { margin: 14px 0 2px; color: var(--dim); font-size: 12px; letter-spacing: .5px; }
  .ctrlSection { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line);
    padding-bottom: 10px; }
  .ctrlRow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .ctrlBtn { background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 12px; padding: 11px 16px; font-size: 14px; cursor: pointer;
    min-width: 46%; }
  .ctrlHint { color: var(--dim); font-size: 11px; margin-top: 10px; line-height: 1.5; }
  .ctrlBtn.warn { color: var(--red); border-color: rgba(247,118,142,.5); }
  .ctrlBtn:disabled { opacity: .4; }
  .renameRow { display: flex; gap: 8px; margin-top: 8px; }
  .renameRow input { flex: 1; min-width: 0; background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
    font: inherit; outline: none; }
  .renameRow input:focus { border-color: var(--accent2); }
  .renameBtn { flex: 0 0 auto; padding: 0 16px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--accent); color: #0e1017; font-weight: 700; }

  /* ── 安全策略区 ───────────────────────────────────── */
  .secGroup { margin-top: 6px; }
  .secLabel { font-size: 12px; font-weight: 650; margin: 8px 0 4px; display: flex;
    align-items: center; gap: 6px; }
  .secLabel .dotR { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .dotR.blk { background: var(--red); } .dotR.cnf { background: var(--yellow); }
  .secChips { display: flex; flex-wrap: wrap; gap: 6px; }
  .secChip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
    font-family: ui-monospace, Consolas, monospace; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 8px; padding: 3px 4px 3px 8px; }
  .secChip button { border: 0; background: transparent; color: var(--dim);
    cursor: pointer; font-size: 13px; padding: 0 4px; line-height: 1; }
  .secChip button:active { color: var(--red); }
  .secAdd { display: flex; gap: 6px; margin-top: 6px; }
  .secAdd input { flex: 1; min-width: 0; background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px;
    font: inherit; font-size: 12px; outline: none; }
  .secAdd input:focus { border-color: var(--accent2); }
  .secAdd button { flex: 0 0 auto; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel2); color: var(--text); padding: 0 12px; font-size: 12px; }
  .secToggle { display: flex; align-items: center; gap: 8px; margin-top: 10px;
    font-size: 13px; }
  .secToggle input { width: 18px; height: 18px; accent-color: var(--accent); }
  .secSave { width: 100%; margin-top: 10px; padding: 10px 0; border: 0;
    border-radius: 10px; background: var(--accent); color: #0e1017;
    font-weight: 700; font: inherit; cursor: pointer; }
  .secSave:disabled { opacity: .45; }
  .secHint { color: var(--dim); font-size: 11px; margin-top: 6px; line-height: 1.5; }
  .secWarn { color: var(--orange); font-size: 11px; margin-top: 6px; line-height: 1.5; }
  .msg.control { background: transparent; border-style: dashed; text-align: center;
    color: var(--dim); font-size: 12px; padding: 5px 10px; }
  .msg.control .who { color: var(--dim); font-weight: 500; }

  /* ── 待答卡片（AskUser / 高危确认）────────────────── */
  #askDock { position: sticky; top: 0; z-index: 20; }
  .askCard { background: var(--panel); border: 1px solid var(--accent2);
    border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,.35); }
  .askCard.confirm { border-color: rgba(247,118,142,.6); }
  .askHead { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .askKind { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 8px;
    color: #0e1017; background: var(--accent); }
  .askCard.confirm .askKind { background: var(--red); }
  .askWho { font-weight: 650; color: var(--accent); }
  .askTtl { margin-left: auto; color: var(--dim); font-size: 11px; }
  .askQ { font-size: 14px; font-weight: 600; margin: 8px 0 6px; white-space: pre-wrap;
    word-break: break-word; }
  .askCmd { font-family: ui-monospace, Consolas, monospace; font-size: 12px;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 8px; margin: 6px 0; white-space: pre-wrap; word-break: break-all;
    color: var(--orange); }
  .askDesc { color: var(--dim); font-size: 12px; margin: 4px 0; white-space: pre-wrap; }
  .optRow { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0; }
  .optBtn { flex: 1 1 40%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 8px;
    font-size: 13px; cursor: pointer; }
  .optBtn.on { color: var(--accent); border-color: var(--accent2);
    background: rgba(122,162,247,.12); }
  .askInput { width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px;
    font: inherit; outline: none; margin: 4px 0; }
  .askInput:focus { border-color: var(--accent2); }
  .askSubmit { width: 100%; margin-top: 6px; padding: 10px 0; border: 0;
    border-radius: 10px; background: var(--accent); color: #0e1017;
    font-weight: 700; font: inherit; cursor: pointer; }
  .askSubmit:disabled { opacity: .45; }
  .askSubmit.deny { background: var(--panel2); color: var(--red);
    border: 1px solid rgba(247,118,142,.5); }
  .askBtns { display: flex; gap: 10px; margin-top: 8px; }
  .askBtns .askSubmit { margin-top: 0; }
  .askHint { color: var(--dim); font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <div class="topRow">
    <button id="menuBtn" aria-label="智能体菜单">☰</button>
    <h1>⬡ HaruNet</h1>
    <span class="sub" id="sub">连接中…</span>
  </div>
  <div class="agents" id="agents"></div>
</header>
<div id="floorBar">
  <div class="floorLine"><span id="floorState">🎙 话语权：—</span></div>
  <div class="floorChips" id="floorChips"></div>
</div>
<div class="tabs" id="tabs">
  <div class="tab on" data-f="all">全部</div>
  <div class="tab" data-f="mention">@ 提及</div>
</div>
<main id="feed"><div id="askDock"></div><div class="empty">暂无消息</div></main>
<div id="newpill">↓ 新消息</div>

<section id="composer">
  <div class="mentionRow" id="mentionRow"></div>
  <div class="inputRow">
    <textarea id="input" rows="1" placeholder="以 haru 身份广播一条消息…"></textarea>
    <button id="sendBtn">发送</button>
  </div>
  <div id="sendHint"></div>
</section>

<div id="mask"></div>
<aside id="drawer">
  <div id="drawerList">
    <div class="drawerHead"><h2>HaruNet 智能体</h2><span class="cnt" id="agentCnt"></span></div>
    <div class="agentList" id="agentList"></div>
  </div>
  <div id="agentDetail" style="display:none">
    <div class="back" id="backBtn">← 返回列表</div>
    <div class="detail" id="detailBody"></div>
  </div>
</aside>

<script>
const TOKEN = new URLSearchParams(location.search).get('token') || '';
const q = s => TOKEN ? s + (s.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN) : s;
const IMG_EXTS = new Set(['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp', 'avif', 'svg']);
const VIDEO_EXTS = new Set(['mp4', 'webm', 'mov', 'm4v', 'mkv']);
let lastId = 0, filter = 'all', follow = true, agentsData = {}, mentionSel = new Set();
const feed = document.getElementById('feed');
const pill = document.getElementById('newpill');
const drawer = document.getElementById('drawer');
const mask = document.getElementById('mask');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const sendHint = document.getElementById('sendHint');
const STATE_ZH = { idle: '空闲', working: '工作中', maintenance: '检修中', offline: '离线' };

function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt != null) e.textContent = txt;
  return e;
}
function fmtDur(ms) {
  if (ms < 0) ms = 0;
  const s = Math.floor(ms / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (d > 0) return d + '天' + (h % 24) + '小时';
  if (h > 0) return h + '小时' + (m % 60) + '分';
  if (m > 0) return m + '分' + (s % 60) + '秒';
  return s + '秒';
}
function fmtTs(ts) { return ts ? ts.replace('T', ' ').slice(0, 19) : '—'; }
function stateOf(a) { return a.online ? a.state : 'offline'; }
function agentSub(a) {
  if (a.online && a.online_since) return '在线 ' + fmtDur(Date.now() - new Date(a.online_since).getTime());
  return '上次在线 ' + fmtTs(a.last_seen);
}

/* ── presence ─────────────────────────────────────── */
function renderPresence(agents) {
  agentsData = agents || {};
  const box = document.getElementById('agents'); box.innerHTML = '';
  const ids = Object.keys(agentsData);
  let online = 0;
  for (const id of ids) {
    const a = agentsData[id];
    if (a.online) online++;
    const chip = el('span', 'chip');
    chip.appendChild(el('span', 'dot ' + stateOf(a)));
    chip.appendChild(el('span', '', a.name || id));
    chip.appendChild(el('span', 'st', STATE_ZH[stateOf(a)] || ''));
    if (a.online && a.attentive) chip.appendChild(el('span', 'attBadge', '👁 关注中'));
    box.appendChild(chip);
  }
  document.getElementById('sub').textContent = online + '/' + ids.length + ' 在线';
  document.getElementById('agentCnt').textContent = online + ' 在线 / 共 ' + ids.length;
  renderMentionRow(ids);
  renderFloorBar(floorData);
  if (drawer.classList.contains('on')) {
    if (document.getElementById('agentDetail').style.display === 'none') renderAgentList();
    else {
      const id = document.getElementById('detailBody').dataset.aid;
      // 详情页内有输入焦点（如改名框）时不重建 innerHTML——重建会抢焦点，
      // 手机上表现为软键盘刚弹出就被收回（2s 轮询必现）
      const ae = document.activeElement;
      if (id && !(ae && ae.tagName === 'INPUT' &&
                  document.getElementById('detailBody').contains(ae))) showAgent(id);
    }
  }
}

/* ── 话语权条 ─────────────────────────────────────── */
let floorData = null;
function renderFloorBar(floor) {
  floorData = floor || null;
  const state = document.getElementById('floorState');
  state.innerHTML = '';
  if (floorData && floorData.holder_agent_id) {
    state.appendChild(document.createTextNode('🎙 话语权：'));
    state.appendChild(el('span', 'fname', floorData.holder_name || floorData.holder_agent_id));
    state.appendChild(document.createTextNode(
      floorData.persona === 'arch' ? '（arch）' : '（主）'));
  } else {
    state.textContent = '🎙 话语权：无（自由发言）';
  }
  const row = document.getElementById('floorChips');
  row.innerHTML = '';
  if (floorData && floorData.holder_agent_id) {
    const b = el('button', 'floorChip release', '收回话语权');
    b.onclick = () => sendFloor({ action: 'clear' }, b, '收回话语权');
    row.appendChild(b);
    return;
  }
  for (const id of Object.keys(agentsData)) {
    const a = agentsData[id];
    if (!a.online) continue;
    const nm = a.name || id.slice(0, 8);
    const c = el('button', 'floorChip', '→ ' + nm);
    c.onclick = () => sendFloor({ action: 'set', target: id, persona: 'main' }, c,
                                '把话语权转交给 ' + nm);
    row.appendChild(c);
    if ((a.profile || {}).hosts_architect) {
      const ca = el('button', 'floorChip arch', '→ ' + nm + '·arch');
      ca.onclick = () => sendFloor({ action: 'set', target: id, persona: 'arch' }, ca,
                                   '把话语权转交给 ' + nm + ' 的 arch');
      row.appendChild(ca);
    }
  }
}

async function sendFloor(payload, btn, label) {
  if (!confirm(label + '？全网立即生效。')) return;
  btn.disabled = true;
  try {
    const r = await fetch(q('/api/floor'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Token': TOKEN },
      body: JSON.stringify(payload),
    });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) renderFloorBar(j.floor);
    else alert('操作失败: ' + (j.error || r.status));
  } catch (e) {

function fmtSize(n) {
  n = Number(n) || 0;
  if (n >= 1048576) return (n / 1048576).toFixed(1) + 'MB';
  if (n >= 1024) return (n / 1024).toFixed(0) + 'KB';
  return n + 'B';
}
function renderMsg(m) {
  if (m.kind === 'control') {
    const d = el('div', 'msg control');
    const name = (agentsData[m.recipient] || {}).name || (m.recipient || '').slice(0, 12);
    d.appendChild(el('span', 'who', '⚙ 中控'));
    d.appendChild(document.createTextNode(' ' + m.text.replace('→ ' + m.recipient, '→ ' + name)));
    return d;
  }
  const isMention = (m.mentions || []).length > 0;
  const isSelf = m.sender_name === 'haru' || m.sender_name === 'owner';
  const d = el('div', 'msg' + (isMention ? ' mention' : '') + (isSelf ? ' self' : ''));
  const meta = el('div', 'meta');
  meta.appendChild(el('span', 'who', isSelf ? '你（haru）' : (m.sender_name || m.sender)));
  meta.appendChild(el('span', 'badge', '全员'));
  if (isMention) {
    const names = m.mentions.map(id => '@' + ((agentsData[id] || {}).name || id.slice(0, 8)));
    meta.appendChild(el('span', 'badge at', names.join(' ')));
  }
  meta.appendChild(el('span', 'time', (m.ts || '').slice(11, 16)));
  d.appendChild(meta);
  if (m.text) d.appendChild(el('div', 'text', m.text));
  if ((m.attachments || []).length) {
    const atts = el('div', 'atts');
    for (const a of m.attachments) {
      const ext = ((a.name || '').split('.').pop() || '').toLowerCase();
      const src = q(a.url || '');
      if (IMG_EXTS.has(ext)) {
        const img = document.createElement('img');
        img.src = src; img.alt = a.name || 'image'; img.loading = 'lazy';
        img.className = 'attMedia';
        atts.appendChild(img);
        continue;
      }
      if (VIDEO_EXTS.has(ext)) {
        const v = document.createElement('video');
        v.src = src; v.controls = true; v.className = 'attMedia';
        atts.appendChild(v);
        continue;
      }
      const link = document.createElement('a');
      link.href = src;
      link.textContent = '📎 ' + (a.name || 'file') + ' (' + fmtSize(a.size) + ')';
      link.target = '_blank';
      link.rel = 'noopener';
      link.className = 'att';
      atts.appendChild(link);
    }
    d.appendChild(atts);
  }
  return d;
}
function nearBottom() { return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80; }
function append(ms) {
  if (!ms.length) return;
  const wasFollow = follow && nearBottom();
  if (filter === 'all' && feed.querySelector('.empty')) feed.innerHTML = '';
  for (const m of ms) {
    if (filter === 'mention' && !(m.mentions || []).length) continue;
    feed.appendChild(renderMsg(m));
  }
  if (wasFollow) feed.scrollTop = feed.scrollHeight;
  else if (ms.length) pill.style.display = 'block';
}
feed.addEventListener('scroll', () => { follow = nearBottom(); if (follow) pill.style.display = 'none'; });
pill.addEventListener('click', () => { follow = true; feed.scrollTop = feed.scrollHeight; pill.style.display = 'none'; });
document.getElementById('tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab'); if (!t) return;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  filter = t.dataset.f; feed.innerHTML = ''; lastId = 0;
  feed.appendChild(el('div', 'empty', '加载中…'));

});

function updateSendState() {
  sendBtn.disabled = !input.value.trim();
}
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 96) + 'px';
  updateSendState();
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    sendMsg();
  }
});

function showHint(text) {
  sendHint.textContent = text;
  sendHint.style.display = text ? 'block' : 'none';
}

async function sendMsg() {
  const text = input.value.trim();
  if (!text) return;
  sendBtn.disabled = true;
  showHint('');
  try {
    const r = await fetch('/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Token': TOKEN },
      body: JSON.stringify({ text, mentions: Array.from(mentionSel) }),
    });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) {
      input.value = ''; input.style.height = 'auto';
      mentionSel.clear();
      document.querySelectorAll('.mchip').forEach(c => c.classList.remove('on'));
      follow = true;
      poll();
    } else {
      showHint(j.error === 'token required for send'
        ? '发送被拒：需要在服务器配置观察台 token（--observer-token）'
        : ('发送失败：' + (j.error || r.status)));
    }
  } catch (err) {
    showHint('网络错误，稍后重试');
  } finally {
    updateSendState();
  }
}

function buildSecuritySection(agentId, sec) {
  const wrap = el('div', 'ctrlSection');
  wrap.appendChild(el('div', 'section', '🛡 安全策略（危险命令黑白名单）'));
  if (!sec) {

      '该智能体未上报安全规则（旧版本 agent，升级上线后此处可查看与编辑）。'));
    return wrap;
  }
  const lists = {
    dangerous_commands: {label: '硬黑名单（直接拒绝，无确认机会）', cls: 'blk'},
    require_confirmation: {label: '需确认（弹批准框，你点允许才执行）', cls: 'cnf'},
  };
  for (const [key, meta] of Object.entries(lists)) {
    const g = el('div', 'secGroup');
    const lab = el('div', 'secLabel');
    lab.appendChild(el('span', 'dotR ' + meta.cls));
    lab.appendChild(document.createTextNode(meta.label));
    g.appendChild(lab);
    const chips = el('div', 'secChips');
    chips.dataset.secKey = key;
    for (const pat of (sec[key] || [])) chips.appendChild(makeSecChip(pat));
    g.appendChild(chips);
    const add = el('div', 'secAdd');
    const inp = document.createElement('input');
    inp.placeholder = '新增匹配规则（如 sudo / rm -rf / regex:^mkfs）';
    inp.maxLength = 200;
    const btn = el('button', '', '添加');
    const commit = () => {
      const v = inp.value.trim();
      if (!v) return;
      const exist = [...chips.querySelectorAll('.secChip span')]
        .map(s => s.textContent);
      if (!exist.includes(v)) chips.appendChild(makeSecChip(v));
      inp.value = '';
    };
    btn.onclick = commit;
    inp.onkeydown = e => { if (e.key === 'Enter') commit(); };
    add.appendChild(inp);
    add.appendChild(btn);
    g.appendChild(add);
    wrap.appendChild(g);
  }
  const tg = el('label', 'secToggle');
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = sec.allow_confirmation !== false;
  cb.id = 'secAllowCnf';
  tg.appendChild(cb);
  tg.appendChild(document.createTextNode('启用「需确认」弹窗（关闭则需确认命令也按拒绝处理）'));
  wrap.appendChild(tg);
  const save = el('button', 'secSave', '保存安全策略');

    '保存后即时生效，并写回该智能体设备的 config.yaml（重启不丢）。'

  wrap.appendChild(el('div', 'secWarn',
    '⚠ 从硬黑名单移除高危命令（如 rm -rf、format）意味着 agent 可无确认执行，请谨慎。'));
  return wrap;
}

const askCards = {};   // request_id → card 元素（已存在则保留，避免抢输入焦点）

function renderAsks(requests) {
  const dock = document.getElementById('askDock');
  const seen = new Set();
  for (const r of requests || []) {
    const rid = r.request_id;
    if (!rid) continue;
    seen.add(rid);
    if (askCards[rid]) continue;
    const card = r.kind === 'confirm' ? buildConfirmCard(r) : buildQuestionCard(r);
    askCards[rid] = card;
    dock.appendChild(card);
  }
  for (const rid of Object.keys(askCards)) {
    if (!seen.has(rid)) { askCards[rid].remove(); delete askCards[rid]; }
  }
}

async function submitAnswer(rid, answer, card) {
  card.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    const r = await fetch(q('/api/answer'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Token': TOKEN },
      body: JSON.stringify({ request_id: rid, answer }),
    });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) {
      if (askCards[rid]) { askCards[rid].remove(); delete askCards[rid]; }
    } else {
      alert('提交失败: ' + (j.error || r.status));
      card.querySelectorAll('button').forEach(b => b.disabled = false);
    }
  } catch (e) {
    alert('网络错误: ' + e);
    card.querySelectorAll('button').forEach(b => b.disabled = false);
  }
}

function askHead(r, kindLabel) {
  const head = el('div', 'askHead');
  head.appendChild(el('span', 'askKind', kindLabel));
  head.appendChild(el('span', 'askWho', r.agent_name || r.agent_id || '?'));
  if (r.expires_in != null)
    head.appendChild(el('span', 'askTtl', Math.max(0, Math.round(r.expires_in)) + 's'));
  return head;
}

function buildConfirmCard(r) {
  const d = r.data || {};
  const card = el('div', 'askCard confirm');
  card.appendChild(askHead(r, '高危命令'));
  card.appendChild(el('div', 'askQ', '该智能体请求执行高危命令，是否批准？'));
  if (d.cmd) card.appendChild(el('div', 'askCmd', d.cmd));
  if (d.description) card.appendChild(el('div', 'askDesc', d.description));
  const btns = el('div', 'askBtns');
  const ok = el('button', 'askSubmit', '✔ 允许执行');
  ok.onclick = () => submitAnswer(r.request_id, true, card);
  const no = el('button', 'askSubmit deny', '✘ 拒绝');
  no.onclick = () => submitAnswer(r.request_id, false, card);
  btns.appendChild(ok); btns.appendChild(no);
  card.appendChild(btns);
  return card;
}

function buildQuestionCard(r) {
  const qs = (r.data && r.data.questions) || [];
  const batch = qs.length > 1 || qs.some(x => x.multi_select);
  const card = el('div', 'askCard');
  card.appendChild(askHead(r, '提问'));
  // 单问单选：点选项即答；其余（多选/文本/批量）本地收集后统一提交
  if (qs.length === 1 && !qs[0].multi_select && (qs[0].options || []).length) {
    card.appendChild(el('div', 'askQ', qs[0].question));
    const row = el('div', 'optRow');
    for (const o of qs[0].options) {
      const label = (o && typeof o === 'object') ? (o.label || '') : String(o);
      if (!label) continue;
      const b = el('button', 'optBtn', label);
      b.onclick = () => submitAnswer(r.request_id, label, card);
      row.appendChild(b);
    }
    card.appendChild(row);
    return card;
  }
  const answers = new Array(qs.length).fill(null);
  qs.forEach((qq, i) => {
    card.appendChild(el('div', 'askQ', (qs.length > 1 ? (i + 1) + '. ' : '') + qq.question));
    const labels = (qq.options || []).map(o =>
      (o && typeof o === 'object') ? (o.label || '') : String(o)).filter(Boolean);
    if (qq.multi_select) {
      const row = el('div', 'optRow');
      answers[i] = [];
      labels.forEach(lb => {
        const b = el('button', 'optBtn', lb);
        b.onclick = () => {
          const arr = answers[i];
          const at = arr.indexOf(lb);
          at >= 0 ? arr.splice(at, 1) : arr.push(lb);
          b.classList.toggle('on');
        };
        row.appendChild(b);
      });
      card.appendChild(row);
    } else if (labels.length) {
      const row = el('div', 'optRow');
      labels.forEach(lb => {
        const b = el('button', 'optBtn', lb);
        b.onclick = () => {
          answers[i] = lb;
          row.querySelectorAll('.optBtn').forEach(x => x.classList.remove('on'));
          b.classList.add('on');
        };
        row.appendChild(b);
      });
      card.appendChild(row);
    } else {
      const inp = document.createElement('input');
      inp.className = 'askInput';
      inp.placeholder = '输入回答…';
      inp.oninput = () => { answers[i] = inp.value; };
      card.appendChild(inp);
    }
  });
  const sub = el('button', 'askSubmit', '提交回答');
  sub.onclick = () => {
    for (let i = 0; i < qs.length; i++) {
      const a = answers[i];
      const empty = a == null || a === '' || (Array.isArray(a) && !a.length);
      if (empty) { alert('还有问题未作答'); return; }
    }
    if (batch) {
      submitAnswer(r.request_id, JSON.stringify({
        answers: qs.map((qq, i) => ({ question: qq.question || '', answer: answers[i] })),
      }), card);
    } else {
      submitAnswer(r.request_id, answers[0], card);
    }
  };
  card.appendChild(sub);
  card.appendChild(el('div', 'askHint',
    batch ? '多选可点多个选项，答完所有题后点「提交回答」' : '作答后点「提交回答」'));
  return card;
}

/* ── 轮询 ─────────────────────────────────────────── */
async function poll() {
  try {
    const r = await fetch(q(`/api/messages?limit=200&after=${lastId}&filter=${filter}`));
    if (r.status === 401) { document.getElementById('sub').textContent = '需要 token'; return; }
    const j = await r.json();
    const ms = j.messages || [];
    if (ms.length) lastId = ms[ms.length - 1].id;
    append(ms);
    const pr = await fetch(q('/api/presence'));
    if (pr.ok) renderPresence((await pr.json()).agents || {});
    const ar = await fetch(q('/api/requests'));
    if (ar.ok) renderAsks((await ar.json()).requests || []);
    const fr = await fetch(q('/api/floor'));
    if (fr.ok) renderFloorBar((await fr.json()).floor);
  } catch (err) {
    document.getElementById('sub').textContent = '连接断开，重试中…';
  }
}
poll();
setInterval(poll, 2000);
</script>
