memory:
  root_dir: ./runtime_memory
  sqlite:
    enabled: true
    path: ./runtime_memory/memory.db
  pipeline_manager:
    enabled: true
    l1:
      turn_interval: 5
      warmup_enabled: true
      idle_timeout_seconds: 600
    l2:
      delay_after_l1_seconds: 90
      poll_max_seconds: 3600
    l3:
      new_atom_threshold: 50
  scene_blocks:
    dir: ./runtime_memory/scene_blocks
  persona:
    path: ./runtime_memory/persona.md
  migration:
    marker_path: ./runtime_memory/.migration_v2_done
  retrieval:
    enabled: true
    fts_top_k: 8
    embedding_top_k: 8
    bm25_enabled: true
    bm25_top_k: 8
    final_top_k: 6
    query_window_messages: 2
    use_reranker: false
    embedding_model_name: Qwen3-Embedding-0.6B
    embedding_model_path: ./models/embedding_model/Qwen3-Embedding-0.6B
    embedding_provider: local
    embedding_base_url: ''
    embedding_api_key_env: ''
    embedding_dimensions: 1024
    embedding_timeout: 30
    reranker_model_path: ./models/rerank_model/bge-reranker-v2-m3
  pipeline:
    db_enabled: true
  export:
    daily_json_enabled: true
  session_id: default
  daily:
    dir: ./runtime_memory/daily
    retention_days: 7
checkpoint:
  enabled: true
  dir: ./runtime_memory/checkpoints
  max_count: 200
  retention_days: 30
  max_total_mb: 500
  max_blob_mb: 20
  git_baseline_enabled: true
  rollback_on_conflict: warn
  exclude:
  - runtime_memory/**
  - .goharu/**
  - '**/__pycache__/**'
  - '*.pyc'
  - .git/**
agentnet:
  enabled: true
  url: ws://159.75.26.204:6000
  http_base: http://159.75.26.204:6001
  name: goharu
  owner_ids:
  - agt_43346c6e4ef29069
  quiet_seconds: 120           # 群内无@消息攒到安静期再合并导入的秒数
  group_inline_max_chars: 1500 # 群消息总字数超阈值则交压缩智能体摘要，否则内联进上下文
  attention_seconds: 300       # 关注期：被@/私聊/主人说话后，期内所有新消息都唤醒（续期）
  agent_pingpong_limit: 3      # 乒乓刹车：连续 N 轮纯同事对话（无主人参与）后不再唤醒
  focus: 编程与自动化（代码编辑、调试、系统操作）
  tags:
  - coding
  - automation
  - windows
  identity_dir: ./runtime_memory/agentnet/identity
  messagebox_path: ./runtime_memory/agentnet/messagebox.db
prompt:
  system:
    shared: []
    actor:
    - ./prompts/actor/base.md
    day_summary:
    - ./prompts/summarizer/day_summary.md
    topic_merge:
    - ./prompts/summarizer/topic_merge.md
    context_compact:
    - ./prompts/summarizer/context_compact.md
    scene_extractor:
    - ./prompts/memory_pyramid/scene_extractor.md
    persona_generator:
    - ./prompts/memory_pyramid/persona_generator.md
model:
  large-language-model:
    provider: auto
    model: deepseek-flash
    api_key_env: ZHIPU_API_KEY
    base_url: https://api.deepseek.com/anthropic
    max_tokens: 8192
    temperature: 0.7
    top_p: 0.9
    api_timeout: 120
    max_retries: 10
  model_history:
  - model: deepseek-flash
    base_url: https://api.deepseek.com/anthropic
    api_key_env: ZHIPU_API_KEY
  - model: kimi-k3
    base_url: https://api.kimi.com/coding/
    api_key_env: ZHIPU_API_KEY
  - model: glm-5.3-Flash
    base_url: https://open.bigmodel.cn/api/anthropic
    api_key_env: ZHIPU_API_KEY
  - model: MiniMax-M2.7
    base_url: https://api.minimaxi.com/anthropic
    api_key_env: ANTHROPIC_API_KEY
tools:
  runtime: in_process
  background_timeout: 25
  background_timeout_by_tool:
    AgentDelegate: 240
    mcp__*: 120
  background_max_duration_seconds: 150
  background_exempt_tools:
  - AskUser
  - ExitPlanMode
  - Sleep
  background_no_cancel_tools:
  - AgentDelegate
  result_format:
    enabled: true
  verify_nudge:
    enabled: true
    mutation_threshold: 3
    gate_final_answer: true
    max_gate_fires: 2
  loop_guard:
    enabled: true
    repeat_threshold: 3
  result_budget:
    cache_dir: ./runtime_memory/tool_cache
    max_single_tokens: 8000
    max_batch_tokens: 24000
  builtin_modules:
  - Tools.builtin.core_tools
  - Tools.builtin.file_tools
  - Tools.builtin.glob_tool
  - Tools.builtin.agent_delegate
  - Tools.builtin.pdf_tools
  - Tools.builtin.pdf_annotate_tools
  - Tools.builtin.document_tools
  - Tools.builtin.system_info_tool
  - Tools.builtin.skill_tool
  - Tools.builtin.sleep_tool
  - Tools.builtin.memory_tools
  - Tools.builtin.task_tools
  - Tools.builtin.ask_user_tools
  - Tools.builtin.reload_tools
  - Tools.builtin.mcp_tools
  - Tools.builtin.architect_tools
  - Tools.builtin.time_tool
  - Tools.builtin.reminder_tools
  - Tools.builtin.music_tools
  - Tools.builtin.rea_tools
  - Tools.builtin.channel_tools
  - Tools.builtin.plan_mode_tools
  - Tools.builtin.checkpoint_tools
  - Tools.builtin.agentnet_tools
  ask_user:
    timeout_seconds: 300
  mcp:
    call_timeout_seconds: 60
    servers:
      tavily:
        transport: http
        url: https://mcp.tavily.com/mcp/?tavilyApiKey=${TAVILY_API_KEY}
      # ── 本机 stdio MCP 示例（按本机实际路径配置后取消注释）──
      # browser-use:
      #   command: /path/to/browser-use/.venv/bin/python
      #   args: [-m, browser_use.mcp]
      #   env: {ANONYMIZED_TELEMETRY: 'False'}
      # netease-music:
      #   command: /path/to/python
      #   args: [/path/to/netmusic_mcp.py]
      #   call_timeout_seconds: 30
  security:
    allow_confirmation: true
    dangerous_commands:
    - shutdown
    - restart
    - reboot
    - poweroff
    - halt
    - rm -rf
    - del /s
    - del /q
    - rmdir /s
    - format
    - diskpart
    - fdisk
    - mkfs
    - dd
    - sudo
    - runas
    - killall
    - pkill
    - nmap
    require_confirmation:
    - del
    - rmdir
    - taskkill
    - reg delete
    - reg add
    - 'reg '
    - hydra
    - metasploit
    - bcdedit
    - bcdboot
    - powershell -encodedcommand
    - powershell -enc
    enabled: true
agent:
  maxDepth: 200
  step_watchdog_seconds: 150
  max_context_messages: 100000
  background_watch_window: 1800
  background_max_reactivations: 3
  micro_compact:
    enabled: true
    age_threshold_hours: 1
    keep_tool_results: 5
    min_content_chars: 120
  context_compact:
    enabled: true
    auto_enabled: true
    auto_threshold_tokens: 800000
    keep_recent_turns: 4
logging:
  base_dir: ./runtime_memory/logs
  level: INFO
  max_mb: 5
  backup_count: 3
  api:
    enabled: true
  agents:
    enabled: true
agent_delegate:
  explore:
    max_concurrent: 3
  plan:
    max_concurrent: 2
  verify:
    max_concurrent: 1
    max_iterations: 30
  architect:
    max_concurrent: 1
    max_iterations: 40
    memory_root: runtime_memory/architect
  max_iterations: 20
  max_history_turns: 3
architect_hub:
  digest_window: 200
  bootstrap:
    enabled: true                  # 裸机首次部署：探测 + identity.yaml
    identity_path: runtime_memory/identity.yaml
  guardian:
    not_ready_seconds: 600
  upgrade:
    enabled: true
    check_interval_seconds: 1800
    min_commits: 3
    quiet_seconds: 300
    confirm_timeout_seconds: 1800
    repo_dir: .
    staging_dir: runtime_memory/upgrade_staging
    remote: origin
    branch: master
  wake:
    scheduler_interval_seconds: 60
    cooldown_seconds:
      fatal: 1800
      soft_failure: 1800
      code_update: 300
  audit:
    test_timeout: 600
    contract_tests:
    - tests/test_tools_standalone.py
    - tests/test_memory_standalone.py
    - tests/test_prompting_standalone.py
    - tests/test_agent_loop_standalone.py
    - tests/test_llm_standalone.py
    - tests/test_cache_breakpoints.py
ui:
  see:
    thinking: true
    text: true
test: {}
voice:
  wakeup_enabled: false
  asr_enabled: false
  mic_consent: true
sessions:
- id: default
  max_messages: 0
  channels:
  - type: tui
    channel_id: tui_main
  - type: architect_telemetry
    channel_id: arch_telemetry
  - type: qqbot
    channel_id: qq_main
    params:
      require_mention: true
      priority: high
channels:
  plugins:
  - Architect.channel
gateway:
  rpc_port: 8791
  tui_attach_shutdown: true
